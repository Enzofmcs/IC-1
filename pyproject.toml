[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enzo-ic1-research"
version = "0.1.0"
description = "Research notebooks and reproducible analysis tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]
